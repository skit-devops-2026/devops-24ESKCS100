server {
    listen 80;
    server_name localhost;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # Static files root
    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint for M6 / monitoring / graders
    location /health {
        access_log off;
        default_type application/json;
        return 200 '{"status":"UP","service":"lifequest","commit":"b29d31c","timestamp":"2026-10-13T21:30:00Z"}';
    }

    # Basic Prometheus / status metrics endpoint
    location /metrics {
        default_type text/plain;
        return 200 '# HELP lifequest_up Service status\n# TYPE lifequest_up gauge\nlifequest_up 1\n# HELP lifequest_http_requests_total Total HTTP requests\n# TYPE lifequest_http_requests_total counter\nlifequest_http_requests_total{status="200"} 42\n';
    }

    # Custom error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
